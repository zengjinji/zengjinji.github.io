<article class="post-card">
  <div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><span aria-hidden="true">/</span><span>{{ .ReadingTime }} 分钟阅读</span>{{ if .Params.example }}<span class="example-badge">示例</span>{{ end }}</div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}<span class="post-arrow" aria-hidden="true">↗</span></a></h3>
  <p>{{ .Description | default (.Summary | plainify) }}</p>
  <div class="post-tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}"># {{ .LinkTitle }}</a>{{ end }}</div>
</article>
