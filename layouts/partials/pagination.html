{{ if gt .TotalPages 1 }}<nav class="pagination" aria-label="{{ i18n "pagination" }}">{{ if .HasPrev }}<a href="{{ .Prev.URL }}">← {{ i18n "previous_page" }}</a>{{ end }}<span>{{ i18n "page_number" (dict "Current" .PageNumber "Total" .TotalPages) }}</span>{{ if .HasNext }}<a href="{{ .Next.URL }}">{{ i18n "next_page" }} →</a>{{ end }}</nav>{{ end }}
