baseURL = 'https://zengjinji.github.io/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'zengjinji · Technical Notes'
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true
summaryLength = 100

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    title = 'zengjinji · Technical Notes'
    weight = 1
    hasCJKLanguage = false
    [languages.en.params]
      subtitle = 'Technical Notes'
      description = 'Notes on engineering, reading, and everyday learning.'
  [languages.zh]
    label = '中文'
    locale = 'zh-CN'
    title = 'zengjinji · 技术手记'
    weight = 2
    hasCJKLanguage = true
    [languages.zh.params]
      subtitle = '技术手记'
      description = '记录技术实践、阅读笔记与日常思考。'

[pagination]
  pagerSize = 8

[permalinks]
  posts = '/posts/:slug/'

[taxonomies]
  tag = 'tags'

[params]
  author = 'zengjinji'
  github = 'https://github.com/zengjinji'

[markup]
  [markup.highlight]
    style = 'dracula'
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ['HTML', 'RSS']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
